<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WuTong Mountain | 梧桐山</title>

    <meta name="description" content="WuTong Mountain - An AI-powered interactive narrative where you play as Nameless, a dream doctor descending from the mountain to heal the nightmares of a utopian world.">
    <meta name="keywords" content="interactive fiction, AI narrative, choose your own adventure, philosophy, Daoism, dreams, Shenzhen">
    <meta name="theme-color" content="#0a0e27">
    <link rel="canonical" href="https://www.wutongmountain.org/">

    <!-- Icons (browser tab, and the phone home screen) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Link previews on social media and in messaging apps -->
    <meta property="og:title" content="WuTong Mountain | 梧桐山">
    <meta property="og:description" content="The Dream Doctor Descends. A philosophical journey through utopia and nightmare in 2100 Shenzhen.">
    <meta property="og:image" content="https://www.wutongmountain.org/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A cloaked figure with a staff looks out from a cave over misty mountains toward a glittering city.">
    <meta property="og:url" content="https://www.wutongmountain.org/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WuTong Mountain">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="WuTong Mountain | 梧桐山">
    <meta name="twitter:description" content="The Dream Doctor Descends. A philosophical journey through utopia and nightmare in 2100 Shenzhen.">
    <meta name="twitter:image" content="https://www.wutongmountain.org/og-image.jpg">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Drifting mist behind the page -->
    <div id="mist-particles" aria-hidden="true"></div>

    <div class="layout">
        <div class="main-content">
            <div class="container">
                <header>
                    <h1 class="glow-text">WuTong Mountain</h1>
                    <p class="subtitle">梧桐山 | The Dream Doctor Descends</p>
                </header>

                <nav class="controls" aria-label="Game controls">
                    <button type="button" id="save-button" class="control-btn hidden">💾 Save</button>
                    <button type="button" id="load-button" class="control-btn">📖 Load</button>
                    <button type="button" id="export-button" class="control-btn hidden">📜 Export</button>
                    <button type="button" id="journal-toggle" class="control-btn hidden" aria-controls="dream-journal" aria-expanded="false">📔 Journal</button>
                </nav>

                <!-- Shown only before a journey begins -->
                <div id="hero-section" class="hero-section">
                    <img src="hero.jpg" width="1280" height="853" class="hero-image"
                         alt="A cloaked figure with a staff looks out from a cave over misty mountains toward a glittering city.">
                </div>

                <main id="story-container">
                    <div id="loading" class="hidden" role="status">
                        <div class="mist-loader"></div>
                        <p>The mist shifts...</p>
                    </div>

                    <div id="narrative-display" aria-live="polite">
                        <div id="location-info" class="metadata"></div>
                        <div id="narrative-text"></div>
                    </div>

                    <div id="choices-container" class="hidden">
                        <div class="choices-grid"></div>
                    </div>

                    <button type="button" id="start-button" class="start-btn">Begin the Descent</button>
                    <button type="button" id="restart-button" class="restart-btn hidden">Return to the Mountain</button>
                </main>

                <footer>
                    <p>A journey without destination | 無為</p>
                </footer>
            </div>
        </div>

        <!-- Dream Journal sidebar -->
        <aside id="dream-journal" class="dream-journal hidden" aria-label="Dream Journal">
            <div class="journal-header">
                <h3>Dream Journal</h3>
                <button type="button" class="close-journal" id="close-journal" aria-label="Close journal">✕</button>
            </div>

            <div class="journal-stats">
                <div class="stat-item">
                    <span class="stat-label">Steps</span>
                    <span class="stat-value" id="step-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Dreams</span>
                    <span class="stat-value" id="dream-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Begun</span>
                    <span class="stat-value stat-value-small" id="time-elapsed">-</span>
                </div>
            </div>

            <div class="journal-content">
                <h4>Your Path</h4>
                <div class="journal-path" id="journal-path"></div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
